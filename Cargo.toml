[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/itrycodinganditsbad/craft-cloud"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
craft-cloud-proto = { path = "crates/proto" }
craft-cloud-chunker = { path = "crates/chunker" }
craft-cloud-store = { path = "crates/store" }
craft-cloud-meta = { path = "crates/meta" }
craft-cloud-server = { path = "apps/craft-cloud-server" }
argon2 = "0.6"
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytes = "1.10"
object_store = { version = "0.14.2", default-features = false, features = ["aws", "ring"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres"] }
tempfile = "3.20"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "fs", "sync", "net", "time", "signal", "io-std", "io-util"] }
blake3 = "1.8.7"
caseless = "=0.2.2"
proptest = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "=0.1.25"
uuid = { version = "1.28", features = ["v7", "serde"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
