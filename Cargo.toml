[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/itrycodinganditsbad/craft-cloud"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
craft-cloud-proto = { path = "crates/proto" }
craft-cloud-chunker = { path = "crates/chunker" }
craft-cloud-store = { path = "crates/store" }
craft-cloud-meta = { path = "crates/meta" }
craft-cloud-server = { path = "apps/craft-cloud-server" }
craft-cloud-sync = { path = "crates/sync" }
craft-cloud-agent = { path = "apps/craft-cloud-agent" }
craft-cloud-app = { path = "crates/app" }
argon2 = "0.6"
async-trait = "0.1.89"
# `ws`: the server's live service and the agent's local API are WebSockets (tokio-tungstenite, MIT).
axum = { version = "0.8.9", features = ["ws"] }
# WebSocket clients: the agent's live connection to the server, and tests.
tokio-tungstenite = "0.29"
# `craft-cloud-app`: a blocking WebSocket (the same tungstenite tokio-tungstenite is built on) and the HTTP answers'
# parser it uses, so the crate apps link brings no async runtime.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
httparse = "1.10.1"
# A WebSocket's send and receive halves (`SinkExt`, `StreamExt`); tokio-tungstenite builds on it already.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
file-id = "0.2.3"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytes = "1.10"
object_store = { version = "0.14.2", default-features = false, features = ["aws", "ring"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres"] }
tempfile = "3.20"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "fs", "sync", "net", "time", "signal", "io-std", "io-util"] }
blake3 = "1.8.7"
# The agent's network simulation (tests only): turmoil's simulated network, and a plain hyper client and server on it.
turmoil = "0.7.2"
hyper = { version = "1.12", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
http-body = "1.0"
http-body-util = "0.1.5"
tower-service = "0.3.3"
# TLS for the agent's live WebSocket, set up as reqwest sets up its own (rustls with aws-lc-rs and the platform's
# verifier; all three already come with reqwest), and the agent's TLS test (a listener with a test certificate).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
caseless = "=0.2.2"
# The CRDT of live documents (the agent's recents today). Needs `im`, `bitmaps` and `sized-chunks` (MPL-2.0, an
# exception by name in `xtask/src/licenses.rs`) and `xxhash-rust` (BSL-1.0).
loro = "1.16.2"
# The live protocol's frames (`craft-cloud-proto::live`): compact binary serde.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
proptest = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "=0.1.25"
uuid = { version = "1.28", features = ["v7", "serde"] }
# The Craft Cloud app's window: egui on eframe, as the other Craft apps have it; kittest drives it in tests.
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
# The app's folder picker: the OS's native dialog (the XDG desktop portal on Linux, so no GTK), MIT.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
# The app's add-a-computer QR code (Nayuki's QR Code generator, MIT).
qrcodegen = "1.8"
# Windows only: the agent's start-at-login entry under `HKCU\…\Run`. Microsoft's windows-rs crate (MIT OR Apache-2.0);
# its dependencies (windows-link, windows-result, windows-strings) are in the build already.
windows-registry = "0.6.1"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
