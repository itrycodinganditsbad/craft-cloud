[package]
name = "craft-cloud-agent"
description = "The Craft Cloud sync agent: keeps a folder on this computer in step with a Craft Cloud server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
# The local API (loopback HTTP and its recents WebSocket).
axum.workspace = true
blake3.workspace = true
bytes.workspace = true
clap.workspace = true
# `recents`, and `login`/`logout` while `run` runs, are clients of the running agent like an app.
craft-cloud-app.workspace = true
craft-cloud-proto.workspace = true
craft-cloud-sync.workspace = true
file-id.workspace = true
getrandom.workspace = true
jiff.workspace = true
notify.workspace = true
# The live hub: recents documents and their file format, and the WebSocket to the server (TLS as reqwest has it).
futures-util.workspace = true
loro.workspace = true
postcard.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix.workspace = true

[dev-dependencies]
craft-cloud-chunker.workspace = true
craft-cloud-meta = { workspace = true, features = ["test-support"] }
craft-cloud-server = { workspace = true, features = ["test-support"] }
craft-cloud-store.workspace = true
craft-cloud-sync = { workspace = true, features = ["test-support"] }
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
tempfile.workspace = true
tower-service.workspace = true
turmoil.workspace = true
uuid.workspace = true

[lints]
workspace = true
