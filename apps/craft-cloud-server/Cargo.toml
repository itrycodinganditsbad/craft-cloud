[package]
name = "craft-cloud-server"
description = "The Craft Cloud server: HTTP API, accounts and devices, uploads, batch commits, change feed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Blobs on an SFTP server (`[storage] kind = "sftp"`) and the backup to one (`backup`, `restore`). On by default; the pure-Rust
# SSH client behind it (russh) passes `cargo xtask licenses`.
default = ["sftp"]
sftp = ["craft-cloud-store/sftp"]
# Test seams (`AppState::with_clock`); never on in a shipped binary.
test-support = []

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
clap.workspace = true
craft-cloud-meta.workspace = true
craft-cloud-proto.workspace = true
craft-cloud-store.workspace = true
fs4.workspace = true
# The audit export's body is a stream of pages.
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
async-trait.workspace = true
# The tests move the server's clock (`AppState::with_clock`): the feature is on for them only.
craft-cloud-server = { path = ".", features = ["test-support"] }
reqwest.workspace = true
tokio-tungstenite.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
