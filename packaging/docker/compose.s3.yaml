# Overlay for S3-compatible storage instead of the local disk (combine it with compose.postgres.yaml if you like):
#   docker compose -f compose.yaml -f compose.s3.yaml up -d --wait
# Set CC_S3_* and CC_SECRET_S3_* in .env. The keys go into config.toml (mode 0400, readable by the server only) like
# the database password; they are not in the server's environment.
#
# The server needs a route to the S3 endpoint, so it joins `egress`, a network of its own with outbound access. It does
# not join `edge`: Caddy is on `edge` too, and Docker's DNS would then answer `server` with the address on `edge`. Caddy
# would connect from its `edge` address instead of CC_CADDY_IP, the server would not trust that peer and would ignore
# X-Forwarded-For (every client would share one sign-in limit), and update-check, also on `edge`, could reach the server
# without Caddy. On `egress` nothing but the server is attached, and no port is published.

services:
  # Compose puts a file secret into the container's root filesystem, so this one service cannot be read-only here.
  secrets-init:
    read_only: false
    environment:
      STORAGE_KIND: s3
      S3_BUCKET: ${CC_S3_BUCKET:?set CC_S3_BUCKET in .env}
      S3_PREFIX: ${CC_S3_PREFIX:-}
      S3_REGION: ${CC_S3_REGION:-us-east-1}
      S3_ENDPOINT: ${CC_S3_ENDPOINT:-}
      S3_ALLOW_HTTP: ${CC_S3_ALLOW_HTTP:-false}
    secrets:
      - s3_access_key_id
      - s3_secret_access_key

  server:
    networks: [egress]

networks:
  # Outbound access for the server (the S3 endpoint) only. Caddy and update-check are not attached.
  egress: {}

secrets:
  s3_access_key_id: {environment: CC_SECRET_S3_ACCESS_KEY_ID}
  s3_secret_access_key: {environment: CC_SECRET_S3_SECRET_ACCESS_KEY}
