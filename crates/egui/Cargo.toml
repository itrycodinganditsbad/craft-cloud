[package]
name = "craft-cloud-egui"
description = "Craft Cloud's piece of a Craft app's window (egui): the account and status line, the shared recent files, and a live document's badge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
craft-cloud-app.workspace = true
craft-cloud-kit.workspace = true
egui.workspace = true

[dev-dependencies]
# The badge's snapshots: kittest renders on wgpu (a CPU adapter where there is one); they are compared with `image`, not
# with kittest's own `snapshot` feature, which brings an MPL-2.0 crate (as in the Craft Cloud app).
egui_kittest = { workspace = true, features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
