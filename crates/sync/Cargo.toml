[package]
name = "craft-cloud-sync"
description = "The Craft Cloud sync engine: keeps a folder and a space in step, over abstract Fs and Transport traits"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
craft-cloud-chunker.workspace = true
craft-cloud-proto.workspace = true
serde.workspace = true
thiserror.workspace = true

[features]
# The `conformance` module: behaviours every `Fs` must have, as reusable test functions.
test-support = []

[dev-dependencies]
craft-cloud-sync = { path = ".", features = ["test-support"] }
tempfile.workspace = true
craft-cloud-meta.workspace = true
craft-cloud-store.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
